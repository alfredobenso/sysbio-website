name: Build site

# The site is hosted on a Politecnico server, not on GitHub Pages.
# This workflow refreshes the data, builds, and publishes the result in two forms:
#   1. a downloadable artifact (Actions tab → latest run → "site")
#   2. the `build` branch, which holds only the contents of dist/ so the server
#      can `git clone -b build` once and `git pull` on a cron job.

on:
  push:
    branches: [main]
  schedule:
    # nightly refresh of publications and profiles (02:00 UTC = 03:00/04:00 Turin)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Fetch publications and profiles
        # If IRIS / polito.it are unreachable the committed snapshot in src/data is used.
        run: npm run fetch || echo "::warning::fetch failed, building from the committed snapshot"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 30
      - name: Publish dist/ to the build branch
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
