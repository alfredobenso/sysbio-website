# Apache virtual host for www.sysbio.polito.it on precious.polito.it
# Install: sudo cp sysbio.conf /etc/apache2/sites-available/ && sudo a2ensite sysbio && sudo systemctl reload apache2
#
# Until a certificate for www.sysbio.polito.it exists, the :443 host uses the
# precious.polito.it certificate (browsers will warn). After the DNS points
# here, run:  sudo certbot --apache -d www.sysbio.polito.it -d sysbio.polito.it
# and certbot rewrites the SSLCertificate* lines below.

<VirtualHost *:80>
    ServerName www.sysbio.polito.it
    ServerAlias sysbio.polito.it
    ServerAdmin alfredo.benso@polito.it
    DocumentRoot /var/www/sysbio
    # Let certbot answer HTTP-01 challenges, redirect everything else to HTTPS
    RedirectMatch 301 ^/(?!\.well-known/acme-challenge/).* https://www.sysbio.polito.it/
    ErrorLog ${APACHE_LOG_DIR}/sysbio_error.log
    CustomLog ${APACHE_LOG_DIR}/sysbio_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.sysbio.polito.it
    ServerAlias sysbio.polito.it
    ServerAdmin alfredo.benso@polito.it
    DocumentRoot /var/www/sysbio

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/precious.polito.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/precious.polito.it/privkey.pem

    # sysbio.polito.it -> www.sysbio.polito.it
    <If "%{HTTP_HOST} == 'sysbio.polito.it'">
        RedirectMatch 301 ^/(.*)$ https://www.sysbio.polito.it/$1
    </If>

    <Directory /var/www/sysbio>
        Options -Indexes +FollowSymLinks
        # .htaccess in the build sets headers, caching and the 404 page
        AllowOverride All
        Require all granted
    </Directory>
    # Never serve the git metadata of the build checkout
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/sysbio_error.log
    CustomLog ${APACHE_LOG_DIR}/sysbio_access.log combined
</VirtualHost>
</IfModule>
